<div class="ipSettingsPanel">
  <div class="title">Host Network</div>
  <div class="description">This screen allows the user to create a file with the IP Address, Subnet Mask, and Gateway
    Address for the 8810 RTU.</div>
  <div class="inputHeading">Configure RTU Host Network</div>
  <form name="networkForm" #f="ngForm">
    <p>
      <input type="text" class="form-control" id="ipTextbox" name="ipAddress" [(ngModel)]="model.ipAddress" #ipAddress="ngModel"
        [ngClass]="{ 'highlight': ipAddress.value != '' && ipAddress.invalid && ipAddress.dirty}" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
        required placeholder=" IP Address ex. 000.000.000.000">
      <div class="validationText" *ngIf="ipAddress.value != '' && ipAddress.invalid && ipAddress.dirty">
        IP Address is improperly formatted.
      </div>
      <p>
        <input type="text" class="form-control" id="subnetTextbox" name="subnet" [(ngModel)]="model.subnet" #subnet="ngModel"
          [ngClass]="{ 'highlight': subnet.value != '' && subnet.invalid && subnet.dirty}" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
          required placeholder=" Subnet Mask ex. 000.000.000.000">
        <div class="validationText" *ngIf="subnet.value != '' && subnet.invalid && subnet.dirty">
          Subnet Mask is improperly formatted.
        </div>
        <p>
          <input type="text" class="form-control" id="gatewayTextbox" name="gateway" [(ngModel)]="model.gateway"
            #gateway="ngModel" [ngClass]="{ 'highlight': gateway.value != '' && gateway.invalid && gateway.dirty}"
            pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$" required
            placeholder=" Gateway Address ex. 000.000.000.000">
          <div class="validationText" *ngIf="gateway.value != '' && gateway.invalid && gateway.dirty">
            Gateway Address is improperly formatted.
          </div>
          <p>
            <button id="cancelButton" [routerLink]="['home']" class="btn btn-secondary buttonTextClass">Cancel</button>
            <button id="saveButton" [disabled]="!f.valid" class="btn btn-primary buttonTextClass" [ngClass]="{'disabled': (ipAddress.invalid || subnet.invalid || gateway.invalid)}" class="btn btn-primary buttonTextClass"
              (click)="SaveNetworkConfiguration(this.ipAddress.value, this.subnet.value, this.gateway.value)">Save</button>
          </p>
  </form>
</div>
